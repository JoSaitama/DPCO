# Local official-2021-full proportional subset, not the official mini benchmark.
seed = 5
global_batch_size = 256

[data]
name = "inaturalist2021"
num_classes = 10000
image_size = 224
mode = "clean"
prepared_dir = "../data/inaturalist2021_full_t140000_v20000_s42"

[model]
name = "resnet50"
initialization = "random"
precision = "float32"

[method]
name = "sage"

[reference]
name = "error"

[training]
learning_rate = 0.01
total_steps = 2000
l2_coefficient = 0.0
momentum = 0.0
nesterov = false
lr_schedule = "constant"
min_learning_rate = 0.0

[execution]
visible_chips = "0,1,2,3"
chips_per_process_bounds = "2,2,1"
port = 8476
startup_timeout_s = 180
gradient_backend = "jvp"

[results]
root_dir = "results"

[logging]
mode = "steps"
interval = 5
csv_flush_steps = 50
timing_window_steps = 50

[evaluation]
mode = "epochs"
interval = 1.0

[checkpoints]
latest_every_steps = 100
at_epoch_end = false

[probes]
enabled = false
theorem1 = true
theorem2 = true
theorem3 = true
fractions = [0.0, 0.25, 0.5, 0.75, 1.0]
batches_per_node = 3
lr_scales = [1.0, 0.5, 0.25, 0.125, 0.0625]
