[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpco-research"
version = "0.1.0"
description = "Modular sample-contribution optimization experiments in JAX."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["ijson>=3.3,<4", "numpy>=1.26,<3", "Pillow>=11,<14", "certifi>=2024.2.2"]
cnwl = ["opencv-python-headless>=4.10,<5"]
clip = ["torch>=2.2,<3", "torchvision>=0.17,<1", "filelock>=3", "numpy>=1.26,<3", "Pillow>=11,<14", "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6"]
test = ["jax>=0.6,<0.12", "flax>=0.10.4,<0.13", "optax>=0.2.6,<0.3", "Pillow>=11,<14", "filelock>=3", "ijson>=3.3,<4", "opencv-python-headless>=4.10,<5"]
train = ["jax>=0.6,<0.12", "flax>=0.10.4,<0.13", "optax>=0.2.6,<0.3", "Pillow>=11,<14", "datasets>=3,<6", "huggingface_hub>=0.30,<2", "filelock>=3"]
tpu = ["jax[tpu]>=0.6,<0.12"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
dpco-config = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
